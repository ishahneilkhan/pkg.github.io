<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta
    name="theme-color"
    content="#080a0b"
  >

  <meta
    name="description"
    content="Website Deals — Premium live website presentation."
  >

  <title>Live Website Presentation | Website Deals</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap"
    rel="stylesheet"
  >

  <style>
    :root {
      --bg: #070909;
      --bg-soft: #0b0e0e;
      --panel: rgba(18, 21, 21, 0.88);
      --panel-2: rgba(25, 29, 29, 0.82);

      --line: rgba(255,255,255,.09);
      --line-strong: rgba(255,255,255,.14);

      --text: #f7f8f6;
      --muted: #9ba29f;
      --muted-2: #69716d;

      --accent: #b7ff00;
      --accent-soft: rgba(183,255,0,.11);
      --accent-line: rgba(183,255,0,.24);

      --danger: #ff6969;
      --warning: #ffc857;

      --radius-xl: 30px;
      --radius-lg: 22px;
      --radius-md: 16px;

      --shadow:
        0 35px 100px rgba(0,0,0,.46),
        0 10px 35px rgba(0,0,0,.25);

      --ease:
        cubic-bezier(.22,.61,.36,1);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      min-height: 100vh;
      overflow-x: hidden;
      background:
        radial-gradient(
          circle at 50% -20%,
          rgba(183,255,0,.07),
          transparent 34%
        ),
        radial-gradient(
          circle at 85% 60%,
          rgba(255,255,255,.025),
          transparent 25%
        ),
        var(--bg);

      color: var(--text);
      font-family: "DM Sans", sans-serif;
    }

    button,
    a {
      font: inherit;
    }

    button {
      border: 0;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    ::selection {
      background: var(--accent);
      color: #000;
    }

    /* =========================================================
       LOADING
    ========================================================= */

    .boot-screen {
      position: fixed;
      inset: 0;
      z-index: 99999;

      display: grid;
      place-items: center;

      background: #070909;

      transition:
        opacity .7s var(--ease),
        visibility .7s;
    }

    .boot-screen.hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .boot-inner {
      width: min(360px, 82vw);
      text-align: center;
    }

    .boot-logo {
      width: 58px;
      height: 58px;

      margin: 0 auto 20px;

      display: grid;
      place-items: center;

      border-radius: 18px;

      background: var(--accent);
      color: #050505;

      font-family: Manrope, sans-serif;
      font-size: 17px;
      font-weight: 900;

      box-shadow:
        0 0 0 1px rgba(183,255,0,.15),
        0 18px 55px rgba(183,255,0,.12);
    }

    .boot-title {
      font-family: Manrope, sans-serif;
      font-size: 18px;
      font-weight: 800;
      letter-spacing: -.03em;
    }

    .boot-text {
      margin-top: 7px;
      color: var(--muted);
      font-size: 13px;
    }

    .boot-progress {
      height: 2px;
      margin-top: 22px;

      overflow: hidden;
      border-radius: 999px;

      background: rgba(255,255,255,.08);
    }

    .boot-progress span {
      display: block;
      width: 0;
      height: 100%;

      background: var(--accent);

      animation: bootProgress 1.8s var(--ease) forwards;
    }

    @keyframes bootProgress {
      to {
        width: 100%;
      }
    }

    /* =========================================================
       BACKDROP
    ========================================================= */

    .ambient {
      position: fixed;
      inset: 0;
      z-index: -1;
      pointer-events: none;
      overflow: hidden;
    }

    .ambient-grid {
      position: absolute;
      inset: 0;

      background-image:
        linear-gradient(
          rgba(255,255,255,.018) 1px,
          transparent 1px
        ),
        linear-gradient(
          90deg,
          rgba(255,255,255,.018) 1px,
          transparent 1px
        );

      background-size: 60px 60px;

      mask-image:
        linear-gradient(
          to bottom,
          black,
          transparent 75%
        );
    }

    .ambient-orb {
      position: absolute;
      width: 520px;
      height: 520px;

      border-radius: 50%;

      background:
        radial-gradient(
          circle,
          rgba(183,255,0,.075),
          transparent 68%
        );

      filter: blur(30px);
    }

    .orb-one {
      top: -260px;
      left: 15%;
    }

    .orb-two {
      right: -280px;
      top: 30%;
      opacity: .55;
    }

    /* =========================================================
       TOP BAR
    ========================================================= */

    .topbar {
      position: fixed;
      top: 18px;
      left: 50%;

      transform: translateX(-50%);

      width: min(1320px, calc(100% - 28px));

      z-index: 1000;

      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;

      padding: 11px 12px 11px 16px;

      border: 1px solid var(--line);

      border-radius: 18px;

      background:
        linear-gradient(
          180deg,
          rgba(20,23,23,.93),
          rgba(10,12,12,.90)
        );

      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);

      box-shadow:
        0 18px 55px rgba(0,0,0,.28),
        inset 0 1px rgba(255,255,255,.045);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 11px;
      min-width: max-content;
    }

    .brand-mark {
      width: 35px;
      height: 35px;

      display: grid;
      place-items: center;

      border-radius: 10px;

      background: var(--accent);
      color: #050505;

      font-family: Manrope, sans-serif;
      font-size: 12px;
      font-weight: 900;
      letter-spacing: -.04em;
    }

    .brand-copy strong {
      display: block;

      font-family: Manrope, sans-serif;
      font-size: 13px;
      font-weight: 800;

      letter-spacing: -.025em;
    }

    .brand-copy span {
      display: block;

      margin-top: 1px;

      color: var(--muted-2);

      font-size: 9px;
      font-weight: 700;

      letter-spacing: .12em;
      text-transform: uppercase;
    }

    .top-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .status-pill {
      display: inline-flex;
      align-items: center;
      gap: 7px;

      height: 34px;
      padding: 0 12px;

      border:
        1px solid
        rgba(183,255,0,.18);

      border-radius: 999px;

      background: rgba(183,255,0,.055);

      color: #d7ff93;

      font-size: 10px;
      font-weight: 800;

      letter-spacing: .08em;
      text-transform: uppercase;
    }

    .status-dot {
      width: 6px;
      height: 6px;

      border-radius: 50%;

      background: var(--accent);

      box-shadow:
        0 0 0 4px rgba(183,255,0,.08),
        0 0 14px rgba(183,255,0,.45);
    }

    .top-button {
      display: inline-flex;
      align-items: center;
      justify-content: center;

      min-height: 34px;
      padding: 0 13px;

      border: 1px solid var(--line);

      border-radius: 10px;

      background: rgba(255,255,255,.035);

      color: var(--text);

      font-size: 11px;
      font-weight: 700;

      cursor: pointer;

      transition:
        background .25s ease,
        border-color .25s ease,
        transform .25s ease;
    }

    .top-button:hover {
      background: rgba(255,255,255,.07);
      border-color: var(--line-strong);
      transform: translateY(-1px);
    }

    .top-button.primary {
      background: var(--accent);
      border-color: var(--accent);
      color: #050505;
    }

    /* =========================================================
       MAIN
    ========================================================= */

    main {
      width: min(1500px, calc(100% - 28px));
      margin: 0 auto;

      padding-top: 112px;
      padding-bottom: 80px;
    }

    /* =========================================================
       HERO PRESENTATION
    ========================================================= */

    .hero {
      min-height: calc(100vh - 112px);

      display: grid;
      grid-template-columns:
        minmax(280px, .72fr)
        minmax(600px, 1.28fr);

      align-items: center;

      gap: clamp(35px, 6vw, 100px);

      padding: 40px 0 80px;
    }

    .hero-copy {
      max-width: 550px;
      padding-left: clamp(0px, 2vw, 30px);
    }

    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 8px;

      padding: 7px 10px;

      border:
        1px solid
        rgba(183,255,0,.15);

      border-radius: 999px;

      background:
        rgba(183,255,0,.045);

      color: #caff77;

      font-size: 9px;
      font-weight: 800;

      letter-spacing: .13em;
      text-transform: uppercase;
    }

    .eyebrow-dot {
      width: 5px;
      height: 5px;

      border-radius: 50%;

      background: var(--accent);
    }

    .hero-title {
      margin-top: 24px;

      font-family: Manrope, sans-serif;

      font-size:
        clamp(42px, 5vw, 78px);

      line-height: .98;

      letter-spacing: -.065em;

      font-weight: 800;
    }

    .hero-title span {
      color: var(--accent);
    }

    .hero-description {
      max-width: 490px;

      margin-top: 24px;

      color: var(--muted);

      font-size:
        clamp(14px, 1.2vw, 17px);

      line-height: 1.75;
    }

    .hero-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;

      margin-top: 30px;
    }

    .button {
      min-height: 48px;

      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 9px;

      padding: 0 18px;

      border: 1px solid var(--line);

      border-radius: 13px;

      cursor: pointer;

      font-size: 12px;
      font-weight: 800;

      transition:
        transform .25s ease,
        border-color .25s ease,
        background .25s ease;
    }

    .button:hover {
      transform: translateY(-2px);
      border-color: var(--line-strong);
    }

    .button.primary {
      color: #050505;
      background: var(--accent);
      border-color: var(--accent);

      box-shadow:
        0 12px 30px rgba(183,255,0,.11);
    }

    .button.secondary {
      background: rgba(255,255,255,.035);
      color: var(--text);
    }

    .hero-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 20px;

      margin-top: 35px;
    }

    .meta-item {
      display: flex;
      align-items: center;
      gap: 9px;

      color: var(--muted);

      font-size: 11px;
      font-weight: 600;
    }

    .meta-icon {
      width: 27px;
      height: 27px;

      display: grid;
      place-items: center;

      border: 1px solid var(--line);

      border-radius: 8px;

      background: rgba(255,255,255,.025);

      color: var(--accent);

      font-size: 10px;
    }

    /* =========================================================
       DEVICE
    ========================================================= */

    .presentation-wrap {
      position: relative;
      width: 100%;
    }

    .device-shadow {
      position: absolute;

      left: 12%;
      right: 12%;
      bottom: -40px;

      height: 100px;

      border-radius: 50%;

      background: rgba(0,0,0,.72);

      filter: blur(30px);
    }

    .laptop {
      position: relative;

      width: 100%;

      transform:
        perspective(1600px)
        rotateY(-3deg)
        rotateX(1deg);

      transform-style: preserve-3d;

      transition: transform .7s var(--ease);
    }

    .laptop:hover {
      transform:
        perspective(1600px)
        rotateY(0deg)
        rotateX(0deg)
        translateY(-3px);
    }

    .screen-bezel {
      position: relative;

      padding: 8px;

      border:
        1px solid
        rgba(255,255,255,.16);

      border-bottom-color:
        rgba(255,255,255,.22);

      border-radius: 22px 22px 10px 10px;

      background:
        linear-gradient(
          145deg,
          #343737,
          #151818 45%,
          #272a2a
        );

      box-shadow:
        0 45px 100px rgba(0,0,0,.55),
        inset 0 1px rgba(255,255,255,.13);
    }

    .screen-bezel::before {
      content: "";

      position: absolute;

      top: 4px;
      left: 50%;

      transform: translateX(-50%);

      width: 5px;
      height: 5px;

      border-radius: 50%;

      background: #050505;

      box-shadow:
        0 0 0 1px rgba(255,255,255,.05);
    }

    .screen {
      position: relative;

      height:
        clamp(420px, 48vw, 650px);

      overflow: hidden;

      border-radius: 15px 15px 4px 4px;

      background: #fff;

      box-shadow:
        inset 0 0 0 1px rgba(0,0,0,.4);
    }

    .browser-bar {
      position: absolute;

      z-index: 20;

      top: 0;
      left: 0;
      right: 0;

      height: 39px;

      display: flex;
      align-items: center;

      padding: 0 13px;

      background:
        rgba(245,246,245,.96);

      border-bottom:
        1px solid
        rgba(0,0,0,.08);
    }

    .browser-dots {
      display: flex;
      gap: 5px;
    }

    .browser-dots span {
      width: 7px;
      height: 7px;

      border-radius: 50%;

      background: #c8ccca;
    }

    .browser-address {
      width: min(420px, 58%);

      height: 23px;

      margin: 0 auto;

      display: flex;
      align-items: center;

      padding: 0 10px;

      border-radius: 6px;

      background: #fff;

      border: 1px solid #e4e7e5;

      color: #7a817e;

      font-size: 8px;
      font-weight: 600;

      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .browser-secure {
      color: #4c9a1a;
      margin-right: 5px;
    }

    .iframe-camera {
      position: absolute;

      top: 39px;
      left: 0;

      width: 100%;

      height: calc(100% - 39px);

      overflow: hidden;

      background: #fff;
    }

    .iframe-world {
      position: absolute;

      top: 0;
      left: 0;

      width: 100%;

      transform:
        translate3d(0, 0, 0);

      will-change: transform;
    }

    .iframe-world iframe {
      display: block;

      width: 100%;

      height: 7000px;

      border: 0;

      background: #fff;
    }

    .laptop-base {
      position: relative;

      width: 112%;

      margin-left: -6%;

      height: 18px;

      border-radius:
        0 0 17px 17px;

      background:
        linear-gradient(
          180deg,
          #cfd2d1,
          #8d9290 55%,
          #666b69
        );

      box-shadow:
        0 18px 25px rgba(0,0,0,.25);
    }

    .laptop-base::before {
      content: "";

      position: absolute;

      top: 0;
      left: 35%;

      width: 30%;
      height: 4px;

      border-radius: 0 0 6px 6px;

      background: #767b79;
    }

    .live-chip {
      position: absolute;

      z-index: 30;

      right: 17px;
      bottom: 17px;

      max-width: 280px;

      display: flex;
      align-items: center;
      gap: 10px;

      padding: 10px 12px;

      border:
        1px solid
        rgba(255,255,255,.13);

      border-radius: 13px;

      background:
        rgba(7,9,9,.76);

      backdrop-filter: blur(15px);

      box-shadow:
        0 15px 35px rgba(0,0,0,.22);
    }

    .live-chip-dot {
      width: 8px;
      height: 8px;

      flex: 0 0 auto;

      border-radius: 50%;

      background: var(--accent);

      box-shadow:
        0 0 0 5px rgba(183,255,0,.09);
    }

    .live-chip-copy strong {
      display: block;

      max-width: 210px;

      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;

      font-size: 10px;
      font-weight: 800;
    }

    .live-chip-copy span {
      display: block;

      margin-top: 2px;

      color: var(--muted);

      font-size: 8px;
    }

    .fake-cursor {
      position: absolute;

      z-index: 40;

      width: 15px;
      height: 19px;

      opacity: 0;

      pointer-events: none;

      filter:
        drop-shadow(0 2px 4px rgba(0,0,0,.4));

      transition:
        left 1.2s var(--ease),
        top 1.2s var(--ease),
        opacity .35s ease;
    }

    .fake-cursor::before {
      content: "";

      position: absolute;

      width: 0;
      height: 0;

      border-top: 17px solid white;
      border-right: 9px solid transparent;

      transform: rotate(-9deg);

      filter:
        drop-shadow(0 0 0 1px #000);
    }

    .iframe-fallback {
      position: absolute;
      inset: 0;
      z-index: 50;

      display: none;

      align-items: center;
      justify-content: center;

      padding: 30px;

      background:
        radial-gradient(
          circle at center,
          rgba(183,255,0,.06),
          transparent 45%
        ),
        #111414;

      text-align: center;
    }

    .iframe-fallback.show {
      display: flex;
    }

    .fallback-inner {
      max-width: 380px;
    }

    .fallback-icon {
      width: 50px;
      height: 50px;

      margin: 0 auto 15px;

      display: grid;
      place-items: center;

      border-radius: 15px;

      border: 1px solid var(--line);

      background: rgba(255,255,255,.035);

      color: var(--accent);

      font-size: 20px;
    }

    .fallback-inner h3 {
      font-family: Manrope, sans-serif;
      font-size: 17px;
    }

    .fallback-inner p {
      margin-top: 8px;

      color: var(--muted);

      font-size: 12px;
      line-height: 1.6;
    }

    /* =========================================================
       CONTROL BAR
    ========================================================= */

    .control-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 15px;

      margin-top: 20px;
      padding: 12px;

      border: 1px solid var(--line);

      border-radius: 16px;

      background:
        rgba(255,255,255,.025);

      box-shadow:
        inset 0 1px rgba(255,255,255,.025);
    }

    .control-left {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .control-button {
      height: 36px;

      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 7px;

      padding: 0 11px;

      border:
        1px solid
        var(--line);

      border-radius: 10px;

      background: rgba(255,255,255,.035);

      color: var(--text);

      font-size: 10px;
      font-weight: 800;

      cursor: pointer;

      transition: .25s ease;
    }

    .control-button:hover {
      background: rgba(255,255,255,.07);
      border-color: var(--line-strong);
    }

    .control-button.active {
      color: #050505;
      background: var(--accent);
      border-color: var(--accent);
    }

    .control-progress {
      flex: 1;

      max-width: 330px;
    }

    .control-progress-top {
      display: flex;
      align-items: center;
      justify-content: space-between;

      margin-bottom: 7px;

      color: var(--muted-2);

      font-size: 8px;
      font-weight: 700;

      text-transform: uppercase;
      letter-spacing: .08em;
    }

    .progress-track {
      height: 3px;

      overflow: hidden;

      border-radius: 999px;

      background: rgba(255,255,255,.07);
    }

    .progress-fill {
      width: 0;
      height: 100%;

      border-radius: inherit;

      background: var(--accent);

      transition: width .2s linear;
    }

    /* =========================================================
       INFORMATION STRIP
    ========================================================= */

    .info-strip {
      display: grid;

      grid-template-columns:
        repeat(4, 1fr);

      gap: 1px;

      margin-top: 25px;

      border:
        1px solid
        var(--line);

      border-radius: 20px;

      overflow: hidden;

      background: var(--line);
    }

    .info-cell {
      padding: 20px;

      background:
        rgba(255,255,255,.025);
    }

    .info-cell span {
      display: block;

      color: var(--muted-2);

      font-size: 9px;
      font-weight: 700;

      letter-spacing: .1em;
      text-transform: uppercase;
    }

    .info-cell strong {
      display: block;

      margin-top: 8px;

      font-family: Manrope, sans-serif;

      font-size: 14px;
      font-weight: 800;
    }

    /* =========================================================
       DETAILS
    ========================================================= */

    .details-section {
      padding: 110px 0 20px;
    }

    .section-head {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 30px;

      margin-bottom: 35px;
    }

    .section-kicker {
      color: var(--accent);

      font-size: 9px;
      font-weight: 800;

      letter-spacing: .14em;
      text-transform: uppercase;
    }

    .section-title {
      margin-top: 10px;

      font-family: Manrope, sans-serif;

      font-size:
        clamp(28px, 3.5vw, 48px);

      line-height: 1.03;

      letter-spacing: -.05em;

      font-weight: 800;
    }

    .section-description {
      max-width: 450px;

      color: var(--muted);

      font-size: 13px;
      line-height: 1.7;
    }

    .details-grid {
      display: grid;

      grid-template-columns:
        repeat(3, 1fr);

      gap: 15px;
    }

    .detail-card {
      min-height: 210px;

      padding: 25px;

      border:
        1px solid
        var(--line);

      border-radius: 22px;

      background:
        linear-gradient(
          145deg,
          rgba(255,255,255,.035),
          rgba(255,255,255,.015)
        );

      transition:
        transform .35s var(--ease),
        border-color .35s ease;
    }

    .detail-card:hover {
      transform: translateY(-5px);
      border-color: var(--line-strong);
    }

    .detail-number {
      width: 34px;
      height: 34px;

      display: grid;
      place-items: center;

      border:
        1px solid
        var(--accent-line);

      color: var(--accent);

        var(--accent-soft);

      font-size: 10px;
      font-weight: 900;
    }

    .detail-card h3 {

      font-weight: 800;

      color: var(--muted);

      font-size: 12px;
      line-height: 1.7;

    /* =========================================================
       FOOTER
    ========================================================= */

    footer {
      width: min(1500px, calc(100% - 28px));
      margin: 100px auto 30px;

      padding-top: 25px;

      border-top:
        1px solid
        var(--line);

      display: flex;
      align-items: center;
      justify-content: space-between;

    }

    .footer-copy {
      color: var(--muted-2);

      line-height: 1.6;
    }

    .footer-copy strong {
      color: var(--text);
    }

    .footer-links {
      display: flex;
      gap: 8px;
    }

    .footer-link {
      padding: 8px 10px;

      border:
        1px solid
        var(--line);

      border-radius: 8px;

      color: var(--muted);

      font-size: 9px;
      font-weight: 700;

      transition: .25s ease;
    }

    .footer-link:hover {
      color: var(--text);
      background: rgba(255,255,255,.035);

    /* =========================================================
       EMPTY STATE
    ========================================================= */

    .empty-state {
      min-height: 70vh;

      display: grid;
      place-items: center;

      text-align: center;
    }

    .empty-inner {
      max-width: 520px;
      padding: 30px;
    }

    .empty-icon {
      width: 65px;
      height: 65px;

      margin: 0 auto 20px;

      display: grid;
      place-items: center;

      border:
        1px solid
        var(--line);

      border-radius: 20px;

      background:
        rgba(255,255,255,.035);

      font-size: 25px;
    }

    .empty-inner h1 {
      font-family: Manrope, sans-serif;
      font-size: 30px;
      letter-spacing: -.04em;
    }

    .empty-inner p {
      margin-top: 10px;

      color: var(--muted);

      font-size: 13px;
      line-height: 1.7;
    }

    /* =========================================================
       MOBILE
    ========================================================= */

    @media (max-width: 1100px) {
      .hero {
        grid-template-columns: 1fr;
        gap: 45px;
      }

      .hero-copy {
        max-width: 700px;
      }

      .presentation-wrap {
        max-width: 900px;
        margin: 0 auto;
      }

      .details-grid {
        grid-template-columns: repeat(2, 1fr);
      }
    }

    @media (max-width: 720px) {
      .topbar {
        top: 10px;

        width:
          calc(100% - 18px);

        padding: 9px 10px;
      }

      .brand-copy {
        display: none;
      }

      .status-pill {
        display: none;
      }

      .top-button {
        min-height: 32px;
      }

      main {
        width:
          calc(100% - 18px);

        padding-top: 78px;
      }

      .hero {
        min-height: auto;
        padding-top: 40px;
      }

      .hero-title {
        font-size: 42px;
      }

      .hero-description {
        font-size: 13px;
      }

      .hero-meta {
        gap: 10px;
      }

      .meta-item {
        font-size: 10px;
      }

      .screen {
        height: 430px;
      }

      .laptop {
        transform: none;
      }

      .laptop:hover {
        transform: none;
      }

      .screen-bezel {
        padding: 5px;
        border-radius: 15px 15px 7px 7px;
      }

      .screen {
        border-radius: 10px 10px 3px 3px;
      }

      .browser-bar {
        height: 32px;
      }

      .browser-address {
        font-size: 7px;
      }

      .iframe-camera {
        top: 32px;
        height: calc(100% - 32px);
      }

      .laptop-base {
        height: 11px;
      }

      .live-chip {
        right: 8px;
        bottom: 8px;
      }

      .control-bar {
        align-items: stretch;
        flex-direction: column;
      }

      .control-progress {
        max-width: none;
      }

      .info-strip {
        grid-template-columns: repeat(2, 1fr);
      }

      .details-section {
        padding-top: 75px;
      }

      .section-head {
        display: block;
      }

      .section-description {
        margin-top: 15px;
      }

      .details-grid {
        grid-template-columns: 1fr;
      }

      footer {
        display: block;
      }

      .footer-links {
        margin-top: 15px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      html {
        scroll-behavior: auto;
      }

      *,
      *::before,
      *::after {
        animation-duration: .01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: .01ms !important;
      }
    }
  </style>
</head>

  <script>
    /* =========================================================
       WEBSITE DEALS
       ULTRA PREMIUM PRESENTATION ENGINE
    ========================================================= */

    (() => {

      "use strict";

      /* =======================================================
         STORAGE
      ======================================================== */

      const SITE_KEY =
        "websiteDealsWebsites";

      const SETTINGS_KEY =
        "websiteDealsSettings";

      const defaultSettings = {

        brandName:
          "Website Deals",

        shortName:
          "Website Deals",

        tagline:
          "Premium Ready-Made Websites",

        supportUrl:
          "https://support.websitedeals.com",

        supportEmail:
          "support@websitedeals.com",

        showcaseEnabled:
          true,

        autoPresentation:
          true,

        humanCursor:
          true,

        pauseOnHover:
          true,

        scrollSpeed:
          1,

        readingPause:
          2.5,

        presentationMode:
          "natural",

        deviceMode:
          "desktop",

        websiteSort:
          "manual"
      };

      const defaultSites = [

        {
          id:
            "snk-it-institute",

          name:
            "SNK IT Institute",

          package:
            "business",

          packageLabel:
            "Business Package",

          url:
            "https://snkitinstitute.com",

          status:
            true,

          showcase:
            true,

          sort:
            1,

          note:
            ""
        },

        {
          id:
            "website-deals",

          name:
            "Website Deals",

          package:
            "premium",

          packageLabel:
            "Premium Package",

          url:
            "https://websitedeals.com",

          status:
            true,

          showcase:
            true,

          sort:
            2,

          note:
            ""
        }

      ];

      function safeParse(
        value,
        fallback
      ) {

        try {

          return JSON.parse(value);

        } catch {

          return fallback;

        }

      }

      function loadSites() {

        const stored =
          localStorage.getItem(
            SITE_KEY
          );

        if (!stored) {

          return defaultSites;

        }

        const parsed =
          safeParse(
            stored,
            defaultSites
          );

        return Array.isArray(parsed)
          ? parsed
          : defaultSites;

      }

      function loadSettings() {

        const stored =
          localStorage.getItem(
            SETTINGS_KEY
          );

        const parsed =
          safeParse(
            stored,
            {}
          );

        return {
          ...defaultSettings,
          ...(parsed || {})
        };

      }

      /* =======================================================
         STATE
      ======================================================== */

      const state = {

        sites:
          loadSites(),

        settings:
          loadSettings(),

        selectedSite:
          null,

        running:
          false,

        paused:
          false,

        progress:
          0,

        animationFrame:
          null,

        phase:
          "reading",

        phaseStart:
          0,

        phaseDuration:
          0,

        startTime:
          0,

        direction:
          1,

        cameraY:
          0,

        maxTravel:
          0,

        cursorX:
          50,

        cursorY:
          45,

        cursorTargetX:
          50,

        cursorTargetY:
          45,

        lastCursorMove:
          0

      };

      /* =======================================================
         HELPERS
      ======================================================== */

      function escapeHtml(
        value
      ) {

        return String(
          value ?? ""
        )
        .replace(
          /&/g,
          "&amp;"
        )
        .replace(
          /</g,
          "&lt;"
        )
        .replace(
          />/g,
          "&gt;"
        )
        .replace(
          /"/g,
          "&quot;"
        )
        .replace(
          /'/g,
          "&#039;"
        );

      }

      function normalizeUrl(
        value
      ) {

        if (!value) {
          return "";
        }

        let url =
          String(value).trim();

        if (
          !/^https?:\/\//i.test(
            url
          )
        ) {

          url =
            "https://" + url;

        }

        return url;

      }

      function packageLabel(
        site
      ) {

        if (
          site.packageLabel
        ) {

          return site.packageLabel;

        }

        const map = {

          starter:
            "Starter Package",

          business:
            "Business Package",

          premium:
            "Premium Package"

        };

        return (
          map[site.package] ||
          "Website Package"
        );

      }

      function getSiteFromQuery() {

        const params =
          new URLSearchParams(
            window.location.search
          );

        const id =
          params.get("site");

        if (!id) {
          return null;
        }

        return state.sites.find(
          site =>
            String(site.id) ===
            String(id)
        ) || null;

      }

      function getAvailableSites() {

        let sites =
          state.sites.filter(
            site =>
              site &&
              site.status !== false &&
              site.showcase !== false &&
              site.url
          );

        sites.sort(
          (a, b) => {

            const aSort =
              Number.isFinite(
                Number(a.sort)
              )
                ? Number(a.sort)
                : 9999;

            const bSort =
              Number.isFinite(
                Number(b.sort)
              )
                ? Number(b.sort)
                : 9999;

            return aSort - bSort;

          }
        );

        return sites;

      }

      function getSelectedSite() {

        const querySite =
          getSiteFromQuery();

        if (
          querySite &&
          querySite.status !== false
        ) {

          return querySite;

        }

        return (
          getAvailableSites()[0] ||
          null
        );

      }

      /* =======================================================
         RENDER
      ======================================================== */

      function render() {

        const app =
          document.getElementById(
            "app"
          );

        const site =
          getSelectedSite();

        state.selectedSite =
          site;

        if (!site) {

          app.innerHTML = `
            <section class="empty-state">
              <div class="empty-inner">

                <div class="empty-icon">
                  ◌
                </div>

                <h1>

                    class="button primary"

                  >
                    Back to Website Deals
                  </a>

            </section>
          `;

          return;

        }

        const url =
          normalizeUrl(
            site.url
          );

        app.innerHTML = `

                <br>

              <p class="hero-description">

              </p>

              <div class="hero-actions">

                <button

                >

                </button>

                <button

                  id="restartButton"

                >
                  ↻ Restart Presentation

              </div>

              <div class="hero-meta">

                <div class="meta-item">
                  <div class="meta-icon">
                    ◉
                  </div>

                  <span>
                    Real Website
                  </span>
                </div>

                <div class="meta-item">
                  <div class="meta-icon">
                    ↕
                  </div>

                  <span>
                    Auto Presentation
                  </span>
                </div>

                <div class="meta-item">
                  <div class="meta-icon">
                    ✓
                  </div>

                  <span>
                    Client Ready
                  </span>
                </div>

              </div>

            </div>

            <div class="presentation-wrap">

              <div class="device-shadow"></div>

              <div class="laptop">

                <div class="screen-bezel">

                  <div class="screen">

                    <div class="browser-bar">

                      <div class="browser-dots">
                        <span></span>
                        <span></span>
                        <span></span>
                      </div>

                      <div
                        class="browser-address"
                        id="browserAddress"
                      >
                        <span class="browser-secure">
                          ●
                        </span>
                        ${escapeHtml(url)}
                      </div>

                    </div>

                    <div
                      class="iframe-camera"
                      id="heroCamera"
                    >

                      <div
                        class="iframe-world"
                        id="heroWorld"
                      >

                        <iframe
                          id="heroFrame"
                          src="${escapeHtml(url)}"
                          title="${escapeHtml(site.name)} live website"
                          loading="eager"
                          referrerpolicy="strict-origin-when-cross-origin"
                          allow="fullscreen"
                        ></iframe>

                      </div>

                      <div
                        class="fake-cursor"
                        id="fakeCursor"
                      ></div>

                      <div
                        class="iframe-fallback"
                        id="heroFallback"
                      >

                        <div class="fallback-inner">

                          <div class="fallback-icon">
                            ↗
                          </div>

                          <h3>
                            Live preview unavailable
                          </h3>

                          <p>
                            This website may prevent
                            embedded previews. Open the
                            live website directly to view
                            the complete experience.
                          </p>

                          <button
                            class="button primary"
                            id="fallbackOpen"
                            type="button"
                            style="margin-top:18px"
                          >
                            Open Live Website ↗
                          </button>

                        </div>

                      </div>

                    </div>

                    <div class="live-chip">

                      <span class="live-chip-dot"></span>

                      <div class="live-chip-copy">

                        <strong>
                          ${escapeHtml(site.name)}
                        </strong>

                        <span>
                          ${escapeHtml(packageLabel(site))}
                          · Live Preview
                        </span>

                      </div>

                    </div>

                  </div>

                </div>

                <div class="laptop-base"></div>

              </div>

              <div class="control-bar">

                <div class="control-left">

                  <button
                    class="control-button active"
                    id="pauseButton"
                    type="button"
                  >
                    ❚❚ Pause
                  </button>

                  <button
                    class="control-button"
                    id="restartControl"
                    type="button"
                  >
                    ↻ Restart
                  </button>

                </div>

                <div class="control-progress">

                  <div class="control-progress-top">

                    <span id="phaseLabel">
                      Reading
                    </span>

                    <span id="progressText">
                      0%
                    </span>

                  </div>

                  <div class="progress-track">

                    <div
                      class="progress-fill"
                      id="progressFill"
                    ></div>

                  </div>

                </div>

              </div>

              <div class="info-strip">

                <div class="info-cell">
                  <span>Website</span>
                  <strong id="infoWebsite">
                    ${escapeHtml(site.name)}
                  </strong>
                </div>

                <div class="info-cell">
                  <span>Package</span>
                  <strong>
                    ${escapeHtml(packageLabel(site))}
                  </strong>
                </div>

                <div class="info-cell">
                  <span>Presentation</span>
                  <strong>
                    Natural Flow
                  </strong>
                </div>

                <div class="info-cell">
                  <span>Status</span>
                  <strong>
                    ● Live
                  </strong>
                </div>

              </div>

            </div>

          </section>

          <section class="details-section">

            <div class="section-head">

              <div>

                <div class="section-kicker">
                  Why this presentation
                </div>

                <h2 class="section-title">
                  Designed to make
                  <br>
                  the website feel real.
                </h2>

              </div>

              <p class="section-description">
                Instead of showing a static screenshot,
                Website Deals presents the actual website
                inside a premium browser environment so
                visitors can understand the experience
                before opening the live site.
              </p>

            </div>

            <div class="details-grid">

              <article class="detail-card">

                <div class="detail-number">
                  01
                </div>

                <h3>
                  Real website
                </h3>

                <p>
                  The presentation loads the saved live
                  website URL from your Website Deals
                  admin system.
                </p>

              </article>

              <article class="detail-card">

                <div class="detail-number">
                  02
                </div>

                <h3>
                  Human-like movement
                </h3>

                <p>
                  The camera moves gradually through the
                  page with reading pauses, variable
                  movement and subtle cursor activity.
                </p>

              </article>

              <article class="detail-card">

                <div class="detail-number">
                  03
                </div>

                <h3>
                  Client-ready experience
                </h3>

                <p>
                  Visitors can watch the website first,
                  then open the complete live experience
                  with one click.
                </p>

              </article>

            </div>

          </section>
        `;

        bindUI();

        startPresentation();

      }

      /* =======================================================
         UI
      ======================================================== */

      function bindUI() {

        const site =
          state.selectedSite;

        const openLiveTop =
          document.getElementById(
            "openLiveTop"
          );

        const heroOpenLive =
          document.getElementById(
            "heroOpenLive"
          );

        const restartButton =
          document.getElementById(
            "restartButton"
          );

        const restartControl =
          document.getElementById(
            "restartControl"
          );

        const pauseButton =
          document.getElementById(
            "pauseButton"
          );

        const fallbackOpen =
          document.getElementById(
            "fallbackOpen"
          );

        const backButton =
          document.getElementById(
            "backButton"
          );

        const openLive =
          () => {

            if (!site?.url) {
              return;
            }

            window.open(
              normalizeUrl(site.url),
              "_blank",
              "noopener,noreferrer"
            );

          };

        openLiveTop?.addEventListener(
          "click",
          openLive
        );

        heroOpenLive?.addEventListener(
          "click",
          openLive
        );

        fallbackOpen?.addEventListener(
          "click",
          openLive
        );

        restartButton?.addEventListener(
          "click",
          restartPresentation
        );

        restartControl?.addEventListener(
          "click",
          restartPresentation
        );

        pauseButton?.addEventListener(
          "click",
          togglePause
        );

        backButton?.addEventListener(
          "click",
          () => {

            if (
              window.history.length > 1
            ) {

              window.history.back();

            } else {

              window.location.href =
                "../index.html";

            }

          }
        );

        const frame =
          document.getElementById(
            "heroFrame"
          );

        frame?.addEventListener(
          "load",
          () => {

            setTimeout(
              () => {

                const fallback =
                  document.getElementById(
                    "heroFallback"
                  );

                fallback?.classList.remove(
                  "show"
                );

              },
              700
            );

          }
        );

        window.addEventListener(
          "keydown",
          handleKeyboard
        );

        if (
          state.settings.pauseOnHover
        ) {

          const presentation =
            document.querySelector(
              ".presentation-wrap"
            );

          presentation?.addEventListener(
            "mouseenter",
            () => {

              if (
                state.running &&
                !state.paused
              ) {

                state.hoverPaused =
                  true;

              }

            }
          );

          presentation?.addEventListener(
            "mouseleave",
            () => {

              state.hoverPaused =
                false;

            }
          );

        }

      }

      /* =======================================================
         KEYBOARD
      ======================================================== */

      function handleKeyboard(
        event
      ) {

        if (
          event.code === "Space"
        ) {

          const tag =
            document.activeElement?.tagName;

          if (
            tag !== "INPUT" &&
            tag !== "TEXTAREA"
          ) {

            event.preventDefault();

            togglePause();

          }

        }

        if (
          event.key === "r" ||
          event.key === "R"
        ) {

          restartPresentation();

        }

        if (
          event.key === "Escape"
        ) {

          state.paused =
            true;

          updatePauseButton();

        }

      }

      /* =======================================================
         PRESENTATION ENGINE
      ======================================================== */

      function startPresentation() {

        stopPresentation();

        state.running =
          true;

        state.paused =
          false;

        state.hoverPaused =
          false;

        state.progress =
          0;

        state.cameraY =
          0;

        state.direction =
          1;

        state.phase =
          "reading";

        state.phaseStart =
          performance.now();

        state.phaseDuration =
          getReadingDuration();

        state.startTime =
          performance.now();

        updatePauseButton();

        requestAnimationFrame(
          animationLoop
        );

      }

      function stopPresentation() {

        state.running =
          false;

        if (
          state.animationFrame
        ) {

          cancelAnimationFrame(
            state.animationFrame
          );

        }

        state.animationFrame =
          null;

      }

      function restartPresentation() {

        startPresentation();

        setCursorTarget(
          48,
          42
        );

      }

      function togglePause() {

        state.paused =
          !state.paused;

        updatePauseButton();

      }

      function updatePauseButton() {

        const button =
          document.getElementById(
            "pauseButton"
          );

        if (!button) {
          return;
        }

        if (
          state.paused
        ) {

          button.textContent =
            "▶ Resume";

          button.classList.remove(
            "active"
          );

        } else {

          button.textContent =
            "❚❚ Pause";

          button.classList.add(
            "active"
          );

        }

      }

      function getReadingDuration() {

        const base =
          Number(
            state.settings.readingPause
          ) || 2.5;

        return (
          base *
          1000 *
          (0.85 + Math.random() * 0.6)
        );

      }

      function getScrollDuration() {

        const speed =
          Math.max(
            0.4,
            Math.min(
              2.5,
              Number(
                state.settings.scrollSpeed
              ) || 1
            )
          );

        return (
          (19000 +
            Math.random() * 12000)
          / speed
        );

      }

      function getReturnDuration() {

        const speed =
          Math.max(
            0.4,
            Math.min(
              2.5,
              Number(
                state.settings.scrollSpeed
              ) || 1
            )
          );

        return (
          (16000 +
            Math.random() * 11000)
          / speed
        );

      }

      function animationLoop(
        timestamp
      ) {

        if (!state.running) {
          return;
        }

        state.animationFrame =
          requestAnimationFrame(
            animationLoop
          );

        if (
          state.paused ||
          state.hoverPaused
        ) {

          return;

        }

        const camera =
          document.getElementById(
            "heroCamera"
          );

        const world =
          document.getElementById(
            "heroWorld"
          );

        if (!camera || !world) {
          return;
        }

        calculateTravel();

        const elapsed =
          timestamp -
          state.phaseStart;

        const phaseProgress =
          Math.min(
            1,
            elapsed /
              state.phaseDuration
          );

        if (
          state.phase ===
          "reading"
        ) {

          state.cameraY =
            state.direction === 1
              ? 0
              : state.maxTravel;

          if (
            phaseProgress >= 1
          ) {

            if (
              state.direction === 1
            ) {

              state.phase =
                "scrollDown";

              state.phaseStart =
                timestamp;

              state.phaseDuration =
                getScrollDuration();

            } else {

              state.phase =
                "complete";

              state.phaseStart =
                timestamp;

              state.phaseDuration =
                900;

            }

          }

        }

        else if (
          state.phase ===
          "scrollDown"
        ) {

          const eased =
            easeInOutCubic(
              phaseProgress
            );

          state.cameraY =
            eased *
            state.maxTravel;

          if (
            phaseProgress >= 1
          ) {

            state.phase =
              "bottomPause";

            state.phaseStart =
              timestamp;

            state.phaseDuration =
              3000 +
              Math.random() * 2500;

          }

        }

        else if (
          state.phase ===
          "bottomPause"
        ) {

          state.cameraY =
            state.maxTravel;

          if (
            phaseProgress >= 1
          ) {

            state.phase =
              "scrollUp";

            state.phaseStart =
              timestamp;

            state.phaseDuration =
              getReturnDuration();

          }

        }

        else if (
          state.phase ===
          "scrollUp"
        ) {

          const eased =
            easeInOutCubic(
              phaseProgress
            );

          state.cameraY =
            state.maxTravel *
            (1 - eased);

          if (
            phaseProgress >= 1
          ) {

            state.direction =
              1;

            state.phase =
              "reading";

            state.phaseStart =
              timestamp;

            state.phaseDuration =
              getReadingDuration();

          }

        }

        else if (
          state.phase ===
          "complete"
        ) {

          if (
            phaseProgress >= 1
          ) {

            state.direction =
              1;

            state.phase =
              "reading";

            state.phaseStart =
              timestamp;

            state.phaseDuration =
              getReadingDuration();

            state.cameraY =
              0;

          }

        }

        applyCamera(
          world
        );

        updateProgress(
          timestamp
        );

        updateCursor(
          timestamp
        );

      }

      function calculateTravel() {

        const camera =
          document.getElementById(
            "heroCamera"
          );

        const iframe =
          document.getElementById(
            "heroFrame"
          );

        if (
          !camera ||
          !iframe
        ) {
          return;
        }

        const viewportHeight =
          camera.clientHeight;

        const contentHeight =
          iframe.clientHeight;

        state.maxTravel =
          Math.max(
            0,
            contentHeight -
              viewportHeight
          );

      }

      function applyCamera(
        world
      ) {

        world.style.transform =
          `translate3d(0, ${-state.cameraY}px, 0)`;

      }

      function updateProgress(
        timestamp
      ) {

        const fill =
          document.getElementById(
            "progressFill"
          );

        const text =
          document.getElementById(
            "progressText"
          );

        const label =
          document.getElementById(
            "phaseLabel"
          );

        if (!fill) {
          return;
        }

        let pageProgress =
          0;

        if (
          state.maxTravel > 0
        ) {

          pageProgress =
            Math.min(
              1,
              Math.max(
                0,
                state.cameraY /
                  state.maxTravel
              )
            );

        }

        state.progress =
          pageProgress;

        const percentage =
          Math.round(
            pageProgress * 100
          );

        fill.style.width =
          percentage + "%";

        if (text) {

          text.textContent =
            percentage + "%";

        }

        const labels = {

          reading:
            "Reading",

          scrollDown:
            "Exploring",

          bottomPause:
            "Bottom",

          scrollUp:
            "Returning",

          complete:
            "Restarting"

        };

        if (label) {

          label.textContent =
            labels[state.phase] ||
            "Live";

        }

      }

      /* =======================================================
         EASING
      ======================================================== */

      function easeInOutCubic(
        value
      ) {

        return value < .5
          ? 4 * value * value * value
          : 1 -
            Math.pow(
              -2 * value + 2,
              3
            ) / 2;

      }

      /* =======================================================
         HUMAN CURSOR
      ======================================================== */

      function setCursorTarget(
        x,
        y
      ) {

        state.cursorTargetX =
          x;

        state.cursorTargetY =
          y;

      }

      function updateCursor(
        timestamp
      ) {

        if (
          !state.settings.humanCursor
        ) {

          return;

        }

        const cursor =
          document.getElementById(
            "fakeCursor"
          );

        const camera =
          document.getElementById(
            "heroCamera"
          );

        if (
          !cursor ||
          !camera
        ) {

          return;

        }

        if (
          timestamp -
            state.lastCursorMove >
          2600 +
          Math.random() * 3500
        ) {

          state.lastCursorMove =
            timestamp;

          const patterns = [

            [28, 30],
            [62, 28],
            [74, 48],
            [35, 56],
            [52, 70],
            [82, 66],
            [22, 72]

          ];

          const point =
            patterns[
              Math.floor(
                Math.random() *
                patterns.length
              )
            ];

          setCursorTarget(
            point[0],
            point[1]
          );

        }

        state.cursorX +=
          (
            state.cursorTargetX -
            state.cursorX
          ) * .018;

        state.cursorY +=
          (
            state.cursorTargetY -
            state.cursorY
          ) * .018;

        cursor.style.left =
          `${state.cursorX}%`;

        cursor.style.top =
          `${state.cursorY}%`;

        cursor.style.opacity =
          ".82";

      }

      /* =======================================================
         VISIBILITY
      ======================================================== */

      document.addEventListener(
        "visibilitychange",
        () => {

          if (
            document.hidden
          ) {

            state.visibilityPaused =
              !state.paused;

            if (
              state.visibilityPaused
            ) {

              state.paused =
                true;

              updatePauseButton();

            }

          } else {

            if (
              state.visibilityPaused
            ) {

              state.paused =
                false;

              state.visibilityPaused =
                false;

              updatePauseButton();

            }

          }

        }
      );

      /* =======================================================
         RESIZE
      ======================================================== */

      window.addEventListener(
        "resize",
        () => {

          calculateTravel();

        }
      );

      /* =======================================================
         SETTINGS
      ======================================================== */

      function applySettings() {

        const brand =
          document.getElementById(
            "brandName"
          );

        const support =
          document.getElementById(
            "supportLink"
          );

        if (brand) {

          brand.textContent =
            state.settings.brandName ||
            "Website Deals";

        }

        if (support) {

          support.href =
            state.settings.supportUrl ||
            "https://support.websitedeals.com";

        }

        document.title =
          `${state.selectedSite?.name || "Live Website"} | ${state.settings.brandName || "Website Deals"}`;

      }

      /* =======================================================
         INIT
      ======================================================== */

      function init() {

        document.getElementById(
          "footerYear"
        ).textContent =
          new Date().getFullYear();

        render();

        applySettings();

        setTimeout(
          () => {

            document
              .getElementById(
                "bootScreen"
              )
              ?.classList.add(
                "hidden"
              );

          },
          950
        );

      }

      init();

    })();
  </script>

</body>
</html>
