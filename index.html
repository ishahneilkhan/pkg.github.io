<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  >

  <meta
    name="theme-color"
    content="#f7f8f4"
  >

  <meta
    name="description"
    content="Website Deals — Premium ready-made websites, live website showcases and affordable digital solutions."
  >

  <meta
    name="robots"
    content="index,follow"
  >

  <title>Website Deals | Premium Ready-Made Websites</title>

  <link
    rel="preconnect"
    href="https://fonts.googleapis.com"
  >

  <link
    rel="preconnect"
    href="https://fonts.gstatic.com"
    crossorigin
  >

  <link
    href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&family=Inter:wght@400;500;600;700;800;900&display=swap"
    rel="stylesheet"
  >

  <style>

    /* =========================================================
       ROOT
    ========================================================= */

    :root{
      --lime:#b7ff00;
      --lime-dark:#91cf00;

      --ink:#10120f;
      --ink-soft:#171a15;

      --paper:#f7f8f4;
      --paper-2:#eef1eb;
      --white:#ffffff;

      --muted:#687067;
      --muted-2:#8a9289;

      --line:#dfe4dc;
      --line-dark:rgba(16,18,15,.10);

      --danger:#d94b4b;
      --success:#138a48;

      --shadow-sm:
        0 8px 25px rgba(16,18,15,.06);

      --shadow-md:
        0 20px 60px rgba(16,18,15,.10);

      --shadow-lg:
        0 35px 100px rgba(16,18,15,.14);

      --radius-sm:12px;
      --radius-md:18px;
      --radius-lg:28px;
      --radius-xl:36px;

      --container:1240px;

      --nav-height:72px;
      --salah-height:44px;
    }


    /* =========================================================
       RESET
    ========================================================= */

    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
    }

    html{
      scroll-behavior:smooth;
      background:var(--paper);
    }

    body{
      min-height:100vh;

      background:
        radial-gradient(
          circle at 10% 5%,
          rgba(183,255,0,.10),
          transparent 25%
        ),
        radial-gradient(
          circle at 90% 30%,
          rgba(183,255,0,.07),
          transparent 28%
        ),
        var(--paper);

      color:var(--ink);

      font-family:
        Inter,
        "Hind Siliguri",
        Arial,
        sans-serif;

      -webkit-font-smoothing:antialiased;
      overflow-x:hidden;
    }

    body.menu-open{
      overflow:hidden;
    }

    img{
      max-width:100%;
      display:block;
    }

    button,
    input,
    textarea,
    select{
      font:inherit;
    }

    button{
      cursor:pointer;
    }

    a{
      color:inherit;
      text-decoration:none;
    }


    /* =========================================================
       CONTAINER
    ========================================================= */

    .container{
      width:min(
        var(--container),
        calc(100% - 40px)
      );

      margin:0 auto;
    }


    /* =========================================================
       SALAH BAR
    ========================================================= */

    .salah-bar{
      position:fixed;

      top:0;
      left:0;
      right:0;

      z-index:2000;

      min-height:var(--salah-height);

      display:flex;
      align-items:center;
      justify-content:center;

      padding:7px 18px;

      background:
        rgba(16,18,15,.96);

      color:#dfe6dc;

      border-bottom:
        1px solid
        rgba(183,255,0,.15);

      backdrop-filter:blur(18px);
      -webkit-backdrop-filter:blur(18px);
    }

    .salah-inner{
      width:min(
        var(--container),
        100%
      );

      display:flex;
      align-items:center;
      justify-content:center;

      gap:10px;
    }

    .salah-title{
      display:flex;
      align-items:center;
      gap:7px;

      color:var(--lime);

      font-size:10px;
      font-weight:900;

      letter-spacing:.08em;
      text-transform:uppercase;

      flex-shrink:0;
    }

    .salah-icon{
      font-size:14px;
    }

    .prayers{
      display:flex;
      align-items:center;
      gap:6px;

      max-width:100%;

      overflow-x:auto;
      scrollbar-width:none;
    }

    .prayers::-webkit-scrollbar{
      display:none;
    }

    .prayer{
      padding:5px 9px;

      border-radius:999px;

      color:#9ca59a;

      background:
        rgba(255,255,255,.035);

      border:
        1px solid
        rgba(255,255,255,.06);

      font-size:9px;
      font-weight:700;

      white-space:nowrap;

      transition:
        background .25s ease,
        color .25s ease,
        border-color .25s ease;
    }

    .prayer.active{
      color:var(--ink);

      background:var(--lime);

      border-color:var(--lime);

      box-shadow:
        0 0 18px
        rgba(183,255,0,.20);
    }


    /* =========================================================
       NAVIGATION
    ========================================================= */

    .navbar{
      position:fixed;

      top:var(--salah-height);
      left:0;
      right:0;

      z-index:1900;

      height:var(--nav-height);

      background:
        rgba(247,248,244,.88);

      border-bottom:
        1px solid
        rgba(16,18,15,.07);

      backdrop-filter:blur(20px);
      -webkit-backdrop-filter:blur(20px);

      transition:
        box-shadow .3s ease,
        background .3s ease;
    }

    .navbar.scrolled{
      background:
        rgba(247,248,244,.96);

      box-shadow:
        0 10px 40px
        rgba(16,18,15,.07);
    }

    .nav-inner{
      height:100%;

      display:flex;
      align-items:center;
      justify-content:space-between;
    }

    .logo{
      display:flex;
      align-items:center;
      gap:11px;

      min-width:0;
    }

    .logo-mark{
      width:40px;
      height:40px;

      display:grid;
      place-items:center;

      border-radius:12px;

      background:var(--ink);
      color:var(--lime);

      font-size:13px;
      font-weight:900;

      box-shadow:
        0 8px 20px
        rgba(16,18,15,.13);
    }

    .logo-text{
      min-width:0;
    }

    .logo-name{
      font-size:14px;
      font-weight:900;

      letter-spacing:-.035em;
    }

    .logo-tagline{
      margin-top:2px;

      color:var(--muted);

      font-size:8px;
      font-weight:800;

      letter-spacing:.12em;
      text-transform:uppercase;
    }

    .nav-links{
      display:flex;
      align-items:center;
      gap:4px;
    }

    .nav-link{
      position:relative;

      padding:9px 12px;

      color:#596158;

      border-radius:10px;

      font-size:11px;
      font-weight:800;

      transition:
        color .2s ease,
        background .2s ease;
    }

    .nav-link:hover{
      color:var(--ink);

      background:
        rgba(16,18,15,.045);
    }

    .nav-link.active{
      color:var(--ink);
    }

    .nav-link.active::after{
      content:"";

      position:absolute;

      left:12px;
      right:12px;
      bottom:3px;

      height:2px;

      border-radius:999px;

      background:var(--lime);
    }

    .nav-cta{
      margin-left:7px;

      padding:10px 15px;

      border-radius:11px;

      color:var(--ink);

      background:var(--lime);

      font-size:10px;
      font-weight:900;

      box-shadow:
        0 7px 20px
        rgba(183,255,0,.20);

      transition:
        transform .2s ease,
        box-shadow .2s ease;
    }

    .nav-cta:hover{
      transform:translateY(-2px);

      box-shadow:
        0 12px 28px
        rgba(183,255,0,.28);
    }

    .menu-btn{
      display:none;

      width:42px;
      height:42px;

      border:1px solid var(--line);

      border-radius:12px;

      background:var(--white);

      color:var(--ink);

      font-size:18px;
    }


    /* =========================================================
       MOBILE MENU
    ========================================================= */

    .mobile-menu{
      position:fixed;

      top:
        calc(
          var(--salah-height) +
          var(--nav-height)
        );

      left:0;
      right:0;
      bottom:0;

      z-index:1800;

      display:none;

      padding:20px;

      background:
        rgba(247,248,244,.98);

      backdrop-filter:blur(20px);

      overflow:auto;
    }

    .mobile-menu.open{
      display:block;
    }

    .mobile-link{
      display:block;

      padding:17px 3px;

      border-bottom:
        1px solid
        var(--line);

      color:var(--ink);

      font-size:17px;
      font-weight:800;
    }

    .mobile-order{
      margin-top:18px;

      display:block;

      padding:15px;

      border-radius:14px;

      text-align:center;

      color:var(--ink);

      background:var(--lime);

      font-size:13px;
      font-weight:900;
    }


    /* =========================================================
       HERO
    ========================================================= */

    .hero{
      position:relative;

      min-height:
        calc(
          100vh -
          var(--salah-height) -
          var(--nav-height)
        );

      padding-top:
        calc(
          var(--salah-height) +
          var(--nav-height) +
          55px
        );

      padding-bottom:80px;

      overflow:hidden;
    }

    .hero-grid{
      display:grid;

      grid-template-columns:
        minmax(0,.85fr)
        minmax(500px,1.15fr);

      align-items:center;

      gap:50px;
    }

    .hero-copy{
      position:relative;
      z-index:3;
    }

    .eyebrow{
      display:inline-flex;
      align-items:center;
      gap:8px;

      padding:7px 10px;

      border:
        1px solid
        rgba(16,18,15,.09);

      border-radius:999px;

      background:
        rgba(255,255,255,.62);

      color:#5b655b;

      font-size:9px;
      font-weight:900;

      letter-spacing:.10em;
      text-transform:uppercase;
    }

    .eyebrow-dot{
      width:7px;
      height:7px;

      border-radius:50%;

      background:var(--lime);

      box-shadow:
        0 0 14px
        rgba(183,255,0,.70);
    }

    .hero h1{
      max-width:720px;

      margin-top:18px;

      font-size:
        clamp(
          45px,
          6.4vw,
          86px
        );

      line-height:.91;

      letter-spacing:-.065em;

      font-weight:900;
    }

    .hero h1 .lime{
      color:var(--lime-dark);
    }

    .hero-description{
      max-width:610px;

      margin-top:22px;

      color:var(--muted);

      font-size:14px;
      line-height:1.8;
    }

    .hero-actions{
      display:flex;
      align-items:center;
      flex-wrap:wrap;

      gap:10px;

      margin-top:27px;
    }

    .btn{
      min-height:46px;

      display:inline-flex;
      align-items:center;
      justify-content:center;
      gap:8px;

      padding:0 17px;

      border-radius:13px;

      font-size:11px;
      font-weight:900;

      transition:
        transform .22s ease,
        box-shadow .22s ease,
        background .22s ease,
        border-color .22s ease;
    }

    .btn:hover{
      transform:translateY(-2px);
    }

    .btn-primary{
      color:var(--ink);

      background:var(--lime);

      box-shadow:
        0 12px 28px
        rgba(183,255,0,.22);
    }

    .btn-primary:hover{
      box-shadow:
        0 18px 36px
        rgba(183,255,0,.30);
    }

    .btn-secondary{
      color:var(--ink);

      background:var(--white);

      border:
        1px solid
        var(--line);

      box-shadow:var(--shadow-sm);
    }

    .hero-note{
      margin-top:16px;

      color:#899188;

      font-size:9px;
      font-weight:600;
    }


    /* =========================================================
       HERO DEVICE
    ========================================================= */

    .hero-device-wrap{
      position:relative;

      z-index:2;

      min-width:0;
    }

    .hero-glow{
      position:absolute;

      left:12%;
      right:12%;
      top:20%;
      bottom:8%;

      background:
        radial-gradient(
          ellipse,
          rgba(183,255,0,.22),
          transparent 65%
        );

      filter:blur(35px);

      pointer-events:none;
    }

    .device{
      position:relative;

      padding:10px;

      border-radius:24px;

      background:
        linear-gradient(
          145deg,
          #31362f,
          #161a15 40%,
          #080a08
        );

      border:
        1px solid
        rgba(16,18,15,.20);

      box-shadow:
        0 35px 90px
        rgba(16,18,15,.25),

        inset 0 1px 0
        rgba(255,255,255,.12);
    }

    .device-camera{
      position:absolute;

      z-index:20;

      top:4px;
      left:50%;

      width:5px;
      height:5px;

      transform:translateX(-50%);

      border-radius:50%;

      background:#000;
    }

    .device-screen{
      position:relative;

      height:
        clamp(
          410px,
          48vw,
          650px
        );

      overflow:hidden;

      border-radius:15px;

      background:#fff;

      box-shadow:
        inset 0 0 0 1px
        rgba(0,0,0,.18);
    }

    .device-screen iframe{
      position:absolute;

      top:0;
      left:0;

      width:100%;
      height:5600px;

      border:0;

      background:#fff;

      transform:
        translate3d(0,0,0);

      transform-origin:top left;

      will-change:transform;

      opacity:0;

      transition:
        opacity .5s ease;
    }

    .device-screen iframe.loaded{
      opacity:1;
    }

    .device-loader{
      position:absolute;

      inset:0;

      z-index:30;

      display:flex;
      align-items:center;
      justify-content:center;

      background:
        linear-gradient(
          145deg,
          #11140f,
          #20251d
        );

      transition:
        opacity .4s ease,
        visibility .4s ease;
    }

    .device-loader.hide{
      opacity:0;
      visibility:hidden;
      pointer-events:none;
    }

    .loader-ring{
      width:35px;
      height:35px;

      border-radius:50%;

      border:
        2px solid
        rgba(255,255,255,.12);

      border-top-color:
        var(--lime);

      animation:
        spin .8s linear infinite;
    }

    @keyframes spin{
      to{
        transform:rotate(360deg);
      }
    }

    .hero-device-caption{
      margin-top:10px;

      display:flex;
      align-items:center;
      justify-content:space-between;

      color:#7f887e;

      font-size:9px;
      font-weight:700;
    }

    .hero-live{
      display:flex;
      align-items:center;
      gap:6px;
    }

    .live-dot{
      width:6px;
      height:6px;

      border-radius:50%;

      background:var(--success);

      box-shadow:
        0 0 10px
        rgba(19,138,72,.45);
    }


    /* =========================================================
       TRUST STRIP
    ========================================================= */

    .trust-strip{
      margin-top:35px;

      padding:14px 0;

      border-top:
        1px solid
        var(--line);

      border-bottom:
        1px solid
        var(--line);
    }

    .trust-grid{
      display:grid;

      grid-template-columns:
        repeat(4,1fr);

      gap:10px;
    }

    .trust-item{
      display:flex;
      align-items:center;
      justify-content:center;
      gap:8px;

      color:#657066;

      font-size:9px;
      font-weight:800;

      text-align:center;
    }

    .trust-icon{
      color:var(--lime-dark);
      font-size:13px;
    }


    /* =========================================================
       SECTION
    ========================================================= */

    section{
      scroll-margin-top:
        calc(
          var(--salah-height) +
          var(--nav-height) +
          25px
        );
    }

    .section{
      padding:105px 0;
    }

    .section-head{
      display:flex;
      align-items:flex-end;
      justify-content:space-between;

      gap:30px;

      margin-bottom:30px;
    }

    .section-eyebrow{
      color:
        var(--lime-dark);

      font-size:9px;
      font-weight:900;

      letter-spacing:.14em;
      text-transform:uppercase;
    }

    .section-title{
      margin-top:8px;

      font-size:
        clamp(
          30px,
          4vw,
          48px
        );

      line-height:1;

      letter-spacing:-.055em;

      font-weight:900;
    }

    .section-description{
      max-width:550px;

      color:var(--muted);

      font-size:12px;
      line-height:1.75;
    }


    /* =========================================================
       SHOWCASE
    ========================================================= */

    .showcase-grid{
      display:grid;

      grid-template-columns:
        repeat(3,1fr);

      gap:18px;
    }

    .showcase-card{
      position:relative;

      min-width:0;

      padding:9px;

      border:
        1px solid
        rgba(16,18,15,.10);

      border-radius:23px;

      background:var(--white);

      box-shadow:var(--shadow-md);

      overflow:hidden;

      transition:
        transform .3s ease,
        box-shadow .3s ease;
    }

    .showcase-card:hover{
      transform:translateY(-6px);

      box-shadow:var(--shadow-lg);
    }

    .showcase-device{
      position:relative;

      overflow:hidden;

      height:390px;

      border-radius:16px;

      background:#f0f2ed;

      border:
        1px solid
        rgba(16,18,15,.08);
    }

    .showcase-device iframe{
      position:absolute;

      top:0;
      left:0;

      width:100%;
      height:5200px;

      border:0;

      background:#fff;

      transform:
        translate3d(0,0,0);

      transform-origin:top left;

      will-change:transform;
    }

    .showcase-shine{
      position:absolute;

      inset:0;

      z-index:5;

      pointer-events:none;

      background:
        linear-gradient(
          115deg,
          rgba(255,255,255,.10),
          transparent 24%,
          transparent 78%,
          rgba(255,255,255,.08)
        );
    }

    .showcase-info{
      padding:14px 5px 5px;
    }

    .showcase-package{
      color:var(--lime-dark);

      font-size:8px;
      font-weight:900;

      letter-spacing:.12em;
      text-transform:uppercase;
    }

    .showcase-name{
      margin-top:5px;

      font-size:15px;
      font-weight:900;

      letter-spacing:-.025em;

      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
    }

    .showcase-url{
      margin-top:4px;

      color:#8a9289;

      font-size:9px;

      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
    }

    .showcase-actions{
      display:flex;

      gap:7px;

      margin-top:12px;
    }

    .mini-btn{
      min-height:34px;

      display:inline-flex;
      align-items:center;
      justify-content:center;

      padding:0 11px;

      border-radius:9px;

      font-size:9px;
      font-weight:900;
    }

    .mini-primary{
      flex:1;

      color:var(--ink);

      background:var(--lime);
    }

    .mini-secondary{
      color:var(--ink);

      background:#f2f4ef;

      border:
        1px solid
        var(--line);
    }


    /* =========================================================
       EMPTY SHOWCASE
    ========================================================= */

    .empty-showcase{
      display:none;

      padding:55px 25px;

      border:
        1px dashed
        #ccd3ca;

      border-radius:22px;

      background:
        rgba(255,255,255,.58);

      text-align:center;
    }

    .empty-showcase.show{
      display:block;
    }

    .empty-icon{
      font-size:30px;
    }

    .empty-title{
      margin-top:12px;

      font-size:18px;
      font-weight:900;
    }

    .empty-text{
      max-width:500px;

      margin:8px auto 0;

      color:var(--muted);

      font-size:11px;
      line-height:1.7;
    }


    /* =========================================================
       PACKAGES
    ========================================================= */

    .packages{
      background:
        linear-gradient(
          180deg,
          transparent,
          rgba(16,18,15,.025)
        );
    }

    .package-grid{
      display:grid;

      grid-template-columns:
        repeat(3,1fr);

      gap:18px;
    }

    .package-card{
      position:relative;

      padding:27px;

      border:
        1px solid
        var(--line);

      border-radius:25px;

      background:var(--white);

      box-shadow:var(--shadow-sm);

      transition:
        transform .3s ease,
        box-shadow .3s ease;
    }

    .package-card:hover{
      transform:translateY(-5px);

      box-shadow:var(--shadow-md);
    }

    .package-card.featured{
      border-color:
        rgba(183,255,0,.55);

      box-shadow:
        0 20px 70px
        rgba(183,255,0,.10);
    }

    .popular{
      position:absolute;

      top:15px;
      right:15px;

      padding:6px 9px;

      border-radius:999px;

      color:var(--ink);

      background:var(--lime);

      font-size:7px;
      font-weight:900;

      letter-spacing:.08em;
      text-transform:uppercase;
    }

    .package-label{
      color:#6b746b;

      font-size:9px;
      font-weight:900;

      letter-spacing:.12em;
      text-transform:uppercase;
    }

    .package-name{
      margin-top:8px;

      font-size:25px;
      font-weight:900;

      letter-spacing:-.045em;
    }

    .package-price{
      display:flex;
      align-items:flex-end;
      gap:4px;

      margin-top:16px;
    }

    .price{
      font-size:40px;
      line-height:.9;

      font-weight:900;

      letter-spacing:-.06em;
    }

    .currency{
      margin-bottom:3px;

      font-size:15px;
      font-weight:900;
    }

    .per{
      margin-bottom:4px;

      color:#7e877d;

      font-size:9px;
      font-weight:700;
    }

    .package-description{
      min-height:54px;

      margin-top:15px;

      color:var(--muted);

      font-size:10px;
      line-height:1.7;
    }

    .feature-list{
      list-style:none;

      margin-top:18px;

      padding-top:18px;

      border-top:
        1px solid
        var(--line);
    }

    .feature-list li{
      display:flex;
      align-items:flex-start;
      gap:8px;

      margin-bottom:9px;

      color:#515b52;

      font-size:10px;
      line-height:1.45;
    }

    .feature-list li::before{
      content:"✓";

      color:#4e7900;

      font-weight:900;
    }

    .package-btn{
      width:100%;

      margin-top:12px;
    }


    /* =========================================================
       ABOUT
    ========================================================= */

    .about-grid{
      display:grid;

      grid-template-columns:
        1fr 1fr;

      gap:45px;

      align-items:center;
    }

    .about-card{
      padding:30px;

      border-radius:27px;

      background:var(--ink);

      color:var(--white);

      box-shadow:var(--shadow-lg);
    }

    .about-card .section-eyebrow{
      color:var(--lime);
    }

    .about-card h3{
      margin-top:12px;

      font-size:34px;
      line-height:1;

      letter-spacing:-.055em;

      font-weight:900;
    }

    .about-card p{
      margin-top:17px;

      color:#9da69d;

      font-size:11px;
      line-height:1.8;
    }

    .about-points{
      display:grid;

      grid-template-columns:
        repeat(2,1fr);

      gap:10px;

      margin-top:23px;
    }

    .about-point{
      padding:14px;

      border:
        1px solid
        rgba(255,255,255,.08);

      border-radius:14px;

      background:
        rgba(255,255,255,.035);
    }

    .about-point strong{
      display:block;

      color:var(--lime);

      font-size:15px;
      font-weight:900;
    }

    .about-point span{
      display:block;

      margin-top:4px;

      color:#8c958c;

      font-size:8px;
      font-weight:700;
    }

    .about-copy h2{
      font-size:
        clamp(
          30px,
          4vw,
          48px
        );

      line-height:1;

      letter-spacing:-.055em;

      font-weight:900;
    }

    .about-copy p{
      margin-top:17px;

      color:var(--muted);

      font-size:12px;
      line-height:1.85;
    }


    /* =========================================================
       SUPPORT
    ========================================================= */

    .support-box{
      position:relative;

      padding:45px;

      overflow:hidden;

      border-radius:30px;

      background:
        linear-gradient(
          135deg,
          #11140f,
          #20261e
        );

      color:var(--white);

      box-shadow:var(--shadow-lg);
    }

    .support-box::after{
      content:"";

      position:absolute;

      width:400px;
      height:400px;

      right:-130px;
      top:-180px;

      border-radius:50%;

      background:
        radial-gradient(
          circle,
          rgba(183,255,0,.18),
          transparent 67%
        );

      pointer-events:none;
    }

    .support-box h2{
      position:relative;
      z-index:2;

      max-width:650px;

      font-size:
        clamp(
          31px,
          4vw,
          52px
        );

      line-height:1;

      letter-spacing:-.055em;

      font-weight:900;
    }

    .support-box p{
      position:relative;
      z-index:2;

      max-width:600px;

      margin-top:15px;

      color:#9da69d;

      font-size:11px;
      line-height:1.8;
    }

    .support-actions{
      position:relative;
      z-index:2;

      display:flex;
      flex-wrap:wrap;

      gap:9px;

      margin-top:23px;
    }


    /* =========================================================
       SALAH SECTION
    ========================================================= */

    .salah-section{
      padding-top:40px;
    }

    .salah-card{
      display:grid;

      grid-template-columns:
        .8fr 1.2fr;

      gap:30px;

      padding:30px;

      border:
        1px solid
        var(--line);

      border-radius:27px;

      background:var(--white);

      box-shadow:var(--shadow-sm);
    }

    .salah-card h2{
      margin-top:9px;

      font-size:30px;

      line-height:1;

      letter-spacing:-.05em;

      font-weight:900;
    }

    .salah-card p{
      margin-top:12px;

      color:var(--muted);

      font-size:11px;
      line-height:1.8;
    }

    .salah-times{
      display:grid;

      grid-template-columns:
        repeat(5,1fr);

      gap:8px;
    }

    .salah-time{
      padding:16px 10px;

      border:
        1px solid
        var(--line);

      border-radius:14px;

      text-align:center;

      background:#fafbf8;
    }

    .salah-time.active{
      color:var(--ink);

      background:var(--lime);

      border-color:var(--lime);
    }

    .salah-time-name{
      font-size:9px;
      font-weight:900;
    }

    .salah-time-value{
      margin-top:6px;

      font-size:14px;
      font-weight:900;
    }


    /* =========================================================
       FOOTER
    ========================================================= */

    footer{
      margin-top:50px;

      padding:
        45px 0
        30px;

      background:var(--ink);

      color:#899188;
    }

    .footer-grid{
      display:grid;

      grid-template-columns:
        1.4fr
        repeat(3,1fr);

      gap:35px;
    }

    .footer-brand{
      max-width:330px;
    }

    .footer-brand-name{
      color:var(--white);

      font-size:16px;
      font-weight:900;

      letter-spacing:-.035em;
    }

    .footer-brand p{
      margin-top:10px;

      color:#747d74;

      font-size:10px;
      line-height:1.8;
    }

    .footer-heading{
      color:#d9dfd8;

      font-size:9px;
      font-weight:900;

      letter-spacing:.10em;

      text-transform:uppercase;
    }

    .footer-links{
      list-style:none;

      margin-top:12px;
    }

    .footer-links li{
      margin-bottom:8px;
    }

    .footer-links a{
      color:#737c73;

      font-size:9px;

      transition:
        color .2s ease;
    }

    .footer-links a:hover{
      color:var(--lime);
    }

    .footer-bottom{
      margin-top:35px;
      padding-top:18px;

      border-top:
        1px solid
        rgba(255,255,255,.07);

      display:flex;
      align-items:center;
      justify-content:space-between;

      gap:15px;

      color:#596159;

      font-size:8px;
    }


    /* =========================================================
       REVEAL
    ========================================================= */

    .reveal{
      opacity:0;

      transform:
        translateY(24px);

      transition:
        opacity .7s ease,
        transform .7s ease;
    }

    .reveal.visible{
      opacity:1;

      transform:
        translateY(0);
    }


    /* =========================================================
       TOAST
    ========================================================= */

    .toast{
      position:fixed;

      left:50%;
      bottom:22px;

      z-index:5000;

      transform:
        translate(-50%,20px);

      padding:11px 15px;

      border-radius:999px;

      color:var(--white);

      background:var(--ink);

      box-shadow:var(--shadow-md);

      font-size:9px;
      font-weight:800;

      opacity:0;
      pointer-events:none;

      transition:
        opacity .25s ease,
        transform .25s ease;
    }

    .toast.show{
      opacity:1;

      transform:
        translate(-50%,0);
    }

       RESPONSIVE
    ========================================================= */
