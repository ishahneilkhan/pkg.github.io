<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta
    name="theme-color"
    content="#080909"
  >

  <meta
    name="description"
    content="Website Deals — Live Website Presentation"
  >

  <title>Live Website Presentation | Website Deals</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link
    href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&family=Inter:wght@400;500;600;700;800;900&display=swap"
    rel="stylesheet"
  >

  <style>
    :root {
      --bg: #080909;
      --bg2: #0d0f0f;
      --panel: #111414;
      --panel2: #151818;
      --border: rgba(255,255,255,.09);
      --border2: rgba(255,255,255,.17);
      --text: #f5f7f6;
      --muted: #929a96;
      --muted2: #626a66;
      --lime: #b7ff00;
      --lime-soft: rgba(183,255,0,.09);
      --lime-border: rgba(183,255,0,.24);
      --danger: #ff6262;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      min-height: 100vh;
      overflow: hidden;
      background:
        radial-gradient(
          circle at 50% -10%,
          rgba(183,255,0,.07),
          transparent 32%
        ),
        var(--bg);
      color: var(--text);
      font-family:
        "Inter",
        "Hind Siliguri",
        sans-serif;
    }

    button,
    a {
      -webkit-tap-highlight-color: transparent;
    }

    button {
      font: inherit;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    /* =========================
       TOP NAV
    ========================= */

    .topbar {
      height: 68px;
      position: fixed;
      inset: 0 0 auto 0;
      z-index: 1000;

      display: flex;
      align-items: center;

      border-bottom: 1px solid var(--border);

      background:
        rgba(8,9,9,.88);

      backdrop-filter: blur(22px);
    }

    .topbar-inner {
      width: min(
        calc(100% - 32px),
        1500px
      );

      height: 100%;
      margin: auto;

      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 11px;
      min-width: 0;
    }

    .brand-mark {
      width: 39px;
      height: 39px;

      display: grid;
      place-items: center;

      flex: 0 0 39px;

      border-radius: 12px;

      background: var(--lime);
      color: #080909;

      font-size: 14px;
      font-weight: 900;

      box-shadow:
        0 0 30px rgba(183,255,0,.12);
    }

    .brand-text {
      min-width: 0;
    }

    .brand-name {
      display: block;

      font-size: 13px;
      font-weight: 900;
      letter-spacing: -.02em;
    }

    .brand-sub {
      display: block;

      margin-top: 2px;

      color: var(--muted2);

      font-size: 8px;
      font-weight: 700;

      letter-spacing: .12em;
      text-transform: uppercase;
    }

    .presentation-info {
      min-width: 0;
      flex: 1;

      display: flex;
      justify-content: center;
      align-items: center;
      gap: 10px;
    }

    .live-pill {
      display: inline-flex;
      align-items: center;
      gap: 7px;

      padding: 7px 10px;

      border: 1px solid var(--lime-border);
      border-radius: 999px;

      background: var(--lime-soft);

      color: var(--lime);

      font-size: 9px;
      font-weight: 900;

      letter-spacing: .09em;
      text-transform: uppercase;
    }

    .live-dot {
      width: 6px;
      height: 6px;

      border-radius: 50%;

      background: var(--lime);

      box-shadow:
        0 0 10px var(--lime);

      animation: livePulse 1.7s infinite;
    }

    @keyframes livePulse {
      0%,
      100% {
        opacity: 1;
        transform: scale(1);
      }

      50% {
        opacity: .45;
        transform: scale(.72);
      }
    }

    .site-name {
      max-width: 360px;

      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;

      color: #cbd1ce;

      font-size: 12px;
      font-weight: 700;
    }

    .nav-actions {
      display: flex;
      align-items: center;
      gap: 7px;
    }

    .nav-btn {
      min-height: 38px;

      padding: 0 13px;

      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 7px;

      border: 1px solid var(--border);
      border-radius: 10px;

      background: rgba(255,255,255,.025);

      color: #d9dedb;

      font-size: 10px;
      font-weight: 800;

      cursor: pointer;

      transition: .2s ease;
    }

    .nav-btn:hover {
      background: rgba(255,255,255,.07);
      border-color: var(--border2);
      transform: translateY(-1px);
    }

    .nav-btn.primary {
      border-color: var(--lime-border);
      background: var(--lime);
      color: #080909;
    }

    /* =========================
       MAIN PRESENTATION
    ========================= */

    .presentation {
      position: fixed;
      inset: 68px 0 0 0;

      display: grid;
      grid-template-columns: 310px 1fr;

      overflow: hidden;
    }

    /* =========================
       LEFT CONTROL PANEL
    ========================= */

    .sidebar {
      position: relative;

      padding: 25px;

      border-right: 1px solid var(--border);

      background:
        linear-gradient(
          180deg,
          #0d0f0f,
          #090a0a
        );

      overflow-y: auto;
    }

    .sidebar::-webkit-scrollbar {
      width: 3px;
    }

    .sidebar::-webkit-scrollbar-thumb {
      background: #292e2c;
      border-radius: 10px;
    }

    .sidebar-label {
      color: var(--muted2);

      font-size: 9px;
      font-weight: 900;

      letter-spacing: .13em;
      text-transform: uppercase;
    }

    .site-title {
      margin-top: 10px;

      font-size: 25px;
      line-height: 1.08;

      letter-spacing: -.045em;
    }

    .site-url {
      margin-top: 9px;

      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;

      color: var(--muted);

      font-size: 10px;
    }

    .status-box {
      margin-top: 22px;

      padding: 14px;

      border: 1px solid var(--border);
      border-radius: 15px;

      background: rgba(255,255,255,.018);
    }

    .status-row {
      display: flex;
      justify-content: space-between;
      gap: 12px;

      font-size: 10px;
    }

    .status-row + .status-row {
      margin-top: 10px;
    }

    .status-row span:first-child {
      color: var(--muted);
    }

    .status-row span:last-child {
      color: #dce1de;
      font-weight: 700;
    }

    .status-live {
      color: var(--lime) !important;
    }

    .controls {
      margin-top: 27px;
    }

    .control-title {
      color: var(--muted2);

      font-size: 9px;
      font-weight: 900;

      letter-spacing: .13em;
      text-transform: uppercase;
    }

    .control-buttons {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;

      margin-top: 11px;
    }

    .control-btn {
      min-height: 43px;

      border: 1px solid var(--border);
      border-radius: 11px;

      background: #111414;

      color: #d8ddda;

      font-size: 10px;
      font-weight: 800;

      cursor: pointer;

      transition: .2s ease;
    }

    .control-btn:hover {
      border-color: var(--border2);
      background: #171a19;
    }

    .control-btn.active {
      border-color: var(--lime-border);
      background: var(--lime-soft);
      color: var(--lime);
    }

    .progress-wrap {
      margin-top: 25px;
    }

    .progress-label {
      display: flex;
      align-items: center;
      justify-content: space-between;

      color: var(--muted);

      font-size: 9px;
    }

    .progress-track {
      height: 5px;

      margin-top: 9px;

      overflow: hidden;

      border-radius: 999px;

      background: #1c201e;
    }

    .progress-bar {
      width: 0%;
      height: 100%;

      border-radius: inherit;

      background: var(--lime);

      box-shadow:
        0 0 12px rgba(183,255,0,.35);

      transition: width .15s linear;
    }

    .hint {
      margin-top: 27px;

      padding: 14px;

      border: 1px solid var(--border);
      border-radius: 15px;

      background: rgba(255,255,255,.015);

      color: var(--muted);

      font-size: 10px;
      line-height: 1.7;
    }

    .hint strong {
      color: #dfe4e1;
    }

    .sidebar-bottom {
      margin-top: 25px;
    }

    .back-link {
      width: 100%;

      min-height: 43px;

      display: flex;
      align-items: center;
      justify-content: center;

      border: 1px solid var(--border);
      border-radius: 11px;

      background: rgba(255,255,255,.025);

      color: #d7ddda;

      font-size: 10px;
      font-weight: 800;

      transition: .2s ease;
    }

    .back-link:hover {
      background: rgba(255,255,255,.07);
      border-color: var(--border2);
    }

    /* =========================
       VIEWPORT
    ========================= */

    .stage {
      position: relative;

      min-width: 0;
      min-height: 0;

      display: flex;
      flex-direction: column;

      background:
        radial-gradient(
          circle at 50% 20%,
          rgba(183,255,0,.035),
          transparent 40%
        ),
        #070808;
    }

    .stage-top {
      height: 50px;

      flex: 0 0 50px;

      padding: 0 18px;

      display: flex;
      align-items: center;
      justify-content: space-between;

      border-bottom: 1px solid var(--border);

      background: rgba(10,11,11,.75);
    }

    .stage-message {
      color: var(--muted);

      font-size: 9px;
    }

    .stage-message strong {
      color: #d7ddda;
    }

    .stage-actions {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .tiny-btn {
      width: 32px;
      height: 30px;

      display: grid;
      place-items: center;

      border: 1px solid var(--border);
      border-radius: 8px;

      background: rgba(255,255,255,.025);

      color: #c7ceca;

      font-size: 12px;

      cursor: pointer;
    }

    .tiny-btn:hover {
      background: rgba(255,255,255,.07);
    }

    /* =========================
       WEBSITE FRAME
    ========================= */

    .frame-area {
      position: relative;

      flex: 1;

      min-height: 0;

      display: flex;
      justify-content: center;

      padding: 20px;
    }

    .browser-shell {
      position: relative;

      width: min(
        1200px,
        100%
      );

      height: 100%;

      overflow: hidden;

      border: 1px solid var(--border2);
      border-radius: 18px;

      background: #101212;

      box-shadow:
        0 30px 80px rgba(0,0,0,.45);
    }

    .browser-header {
      position: relative;
      z-index: 10;

      height: 43px;

      display: flex;
      align-items: center;
      gap: 8px;

      padding: 0 12px;

      border-bottom: 1px solid var(--border);

      background: #111414;
    }

    .browser-dot {
      width: 8px;
      height: 8px;

      border-radius: 50%;

      background: #484e4b;
    }

    .browser-address {
      flex: 1;

      height: 27px;

      padding: 0 10px;

      display: flex;
      align-items: center;

      border: 1px solid var(--border);
      border-radius: 7px;

      background: #090a0a;

      color: #69716d;

      font-size: 8px;

      overflow: hidden;
      white-space: nowrap;
      text-overflow: ellipsis;
    }

    .browser-open {
      height: 27px;

      padding: 0 10px;

      display: flex;
      align-items: center;

      border: 1px solid var(--border);
      border-radius: 7px;

      background: rgba(255,255,255,.03);

      color: #adb5b1;

      font-size: 8px;
      font-weight: 800;
    }

    .website-window {
      position: absolute;

      top: 43px;
      left: 0;
      right: 0;
      bottom: 0;

      overflow: hidden;

      background: #fff;
    }

    /*
      IMPORTANT:
      The iframe itself is intentionally made taller than
      the visible viewport. We move the iframe wrapper
      vertically to create the browsing/camera effect.

      This works with cross-origin websites because the parent
      page does not attempt to access iframe DOM content.
    */

    .camera {
      position: absolute;

      top: 0;
      left: 0;

      width: 100%;

      will-change: transform;

      transform: translate3d(
        0,
        0,
        0
      );
    }

    iframe {
      display: block;

      width: 100%;

      height: 2200px;

      border: 0;

      background: white;

      pointer-events: none;
    }

    /* =========================
       FALLBACK
    ========================= */

    .iframe-fallback {
      position: absolute;

      inset: 0;

      z-index: 30;

      display: none;
      place-items: center;

      padding: 30px;

      background:
        radial-gradient(
          circle at 50% 35%,
          rgba(183,255,0,.07),
          transparent 35%
        ),
        #090a0a;
    }

    .iframe-fallback.show {
      display: grid;
    }

    .fallback-card {
      width: min(
        480px,
        100%
      );

      padding: 30px;

      text-align: center;

      border: 1px solid var(--border);
      border-radius: 20px;

      background: #111414;
    }

    .fallback-icon {
      width: 48px;
      height: 48px;

      margin: 0 auto;

      display: grid;
      place-items: center;

      border-radius: 15px;

      background: var(--lime-soft);
      color: var(--lime);

      font-size: 20px;
    }

    .fallback-card h2 {
      margin-top: 17px;

      font-size: 21px;
      letter-spacing: -.03em;
    }

    .fallback-card p {
      margin-top: 10px;

      color: var(--muted);

      font-size: 11px;
      line-height: 1.7;
    }

    .fallback-btn {
      margin-top: 20px;

      min-height: 43px;

      padding: 0 17px;

      display: inline-flex;
      align-items: center;
      justify-content: center;

      border-radius: 10px;

      background: var(--lime);
      color: #080909;

      font-size: 10px;
      font-weight: 900;
    }

    /* =========================
       FAKE CURSOR
    ========================= */

    .fake-cursor {
      position: absolute;

      z-index: 50;

      width: 18px;
      height: 18px;

      pointer-events: none;

      opacity: .9;

      filter:
        drop-shadow(
          0 3px 6px rgba(0,0,0,.45)
        );

      transition:
        transform 900ms
        cubic-bezier(.2,.8,.2,1);
    }

    .fake-cursor::before {
      content: "";

      position: absolute;

      left: 0;
      top: 0;

      width: 0;
      height: 0;

      border-top: 12px solid white;
      border-right: 7px solid transparent;

      transform:
        rotate(-8deg);
    }

    .fake-cursor::after {
      content: "";

      position: absolute;

      left: 2px;
      top: 2px;

      width: 0;
      height: 0;

      border-top: 8px solid #111;
      border-right: 5px solid transparent;

      transform:
        rotate(-8deg);
    }

    /* =========================
       BOTTOM INFO
    ========================= */

    .stage-bottom {
      position: absolute;

      left: 50%;
      bottom: 16px;

      z-index: 70;

      transform:
        translateX(-50%);

      display: flex;
      align-items: center;
      gap: 7px;

      padding: 7px 10px;

      border: 1px solid rgba(255,255,255,.11);
      border-radius: 999px;

      background: rgba(8,9,9,.78);

      backdrop-filter: blur(14px);

      color: #b6beb9;

      font-size: 8px;

      pointer-events: none;
    }

    .stage-bottom-dot {
      width: 5px;
      height: 5px;

      border-radius: 50%;

      background: var(--lime);

      box-shadow:
        0 0 9px var(--lime);
    }

    /* =========================
       LOADING
    ========================= */

    .loading {
      position: absolute;

      inset: 0;

      z-index: 40;

      display: grid;
      place-items: center;

      background: #080909;

      transition:
        opacity .45s ease,
        visibility .45s ease;
    }

    .loading.hidden {
      opacity: 0;
      visibility: hidden;
    }

    .loader {
      text-align: center;
    }

    .loader-ring {
      width: 34
