<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta
    name="theme-color"
    content="#080909"
  >

  <meta
    name="description"
    content="Website Deals Premium Package — Shopify-style e-commerce website with products, inventory, orders, customers, discounts, analytics, payments, automation and advanced admin tools."
  >

  <title>Premium Package — Website Deals</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&family=Inter:wght@400;500;600;700;800;900&display=swap"
    rel="stylesheet"
  >

  <style>
    :root {
      --bg: #080909;
      --bg-soft: #0d0f0f;
      --card: #111313;
      --card-2: #151818;

      --line: rgba(255,255,255,.09);
      --line-strong: rgba(255,255,255,.15);

      --text: #f5f7f6;
      --muted: #9da5a2;

      --lime: #b7ff00;
      --lime-soft: rgba(183,255,0,.10);
      --lime-border: rgba(183,255,0,.28);

      --purple: #a78bfa;
      --purple-soft: rgba(167,139,250,.10);
      --purple-border: rgba(167,139,250,.25);

      --orange: #ffad66;

      --shadow:
        0 30px 80px rgba(0,0,0,.38);

      --max: 1240px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      min-height: 100vh;

      background:
        radial-gradient(
          circle at 12% 0%,
          rgba(183,255,0,.065),
          transparent 28%
        ),
        radial-gradient(
          circle at 90% 10%,
          rgba(167,139,250,.075),
          transparent 30%
        ),
        var(--bg);

      color: var(--text);

      font-family:
        Inter,
        "Hind Siliguri",
        sans-serif;

      line-height: 1.6;

      overflow-x: hidden;
    }

    body::before {
      content: "";

      position: fixed;

      inset: 0;

      pointer-events: none;

      opacity: .025;

      background-image:
        linear-gradient(
          rgba(255,255,255,.5) 1px,
          transparent 1px
        ),
        linear-gradient(
          90deg,
          rgba(255,255,255,.5) 1px,
          transparent 1px
        );

      background-size: 70px 70px;

      mask-image:
        linear-gradient(
          to bottom,
          black,
          transparent 80%
        );

      z-index: -1;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    button {
      font: inherit;
    }

    .container {
      width:
        min(
          calc(100% - 40px),
          var(--max)
        );

      margin-inline: auto;
    }

    /* =========================
       HEADER
    ========================== */

    .topbar {
      position: sticky;

      top: 0;

      z-index: 100;

      border-bottom:
        1px solid
        var(--line);

      background:
        rgba(8,9,9,.78);

      backdrop-filter:
        blur(20px);
    }

    .nav {
      min-height: 76px;

      display: flex;

      align-items: center;

      justify-content: space-between;

      gap: 20px;
    }

    .brand {
      display: inline-flex;

      align-items: center;

      gap: 12px;

      font-weight: 900;

      letter-spacing: -.04em;
    }

    .brand-mark {
      width: 40px;
      height: 40px;

      display: grid;

      place-items: center;

      border-radius: 13px;

      background:
        var(--lime);

      color:
        #080909;

      font-size: 15px;

      font-weight: 1000;

      box-shadow:
        0 0 0 6px
        rgba(183,255,0,.06),

        0 12px 30px
        rgba(183,255,0,.12);
    }

    .brand-text {
      font-size: 17px;
    }

    .brand-text span {
      color:
        var(--lime);
    }

    .nav-links {
      display: flex;

      align-items: center;

      gap: 8px;
    }

    .nav-links a {
      padding:
        10px 13px;

      color:
        var(--muted);

      border-radius: 12px;

      font-size: 13px;

      font-weight: 700;

      transition:
        .25s ease;
    }

    .nav-links a:hover {
      color:
        var(--text);

      background:
        rgba(255,255,255,.05);
    }

    .nav-cta {
      padding:
        11px 17px !important;

      background:
        var(--lime) !important;

      color:
        #080909 !important;

      font-weight:
        900 !important;
    }

    /* =========================
       BREADCRUMB
    ========================== */

    .breadcrumb-wrap {
      padding-top: 34px;
    }

    .breadcrumb {
      display: flex;

      flex-wrap: wrap;

      gap: 8px;

      align-items: center;

      color:
        var(--muted);

      font-size: 13px;

      font-weight: 600;
    }

    .breadcrumb a:hover {
      color:
        var(--lime);
    }

    .breadcrumb .current {
      color:
        var(--text);
    }

    /* =========================
       HERO
    ========================== */

    .hero {
      padding:
        42px 0 70px;
    }

    .hero-grid {
      display: grid;

      grid-template-columns:
        1.05fr
        .95fr;

      gap: 60px;

      align-items: center;
    }

    .eyebrow {
      display: inline-flex;

      align-items: center;

      gap: 9px;

      padding:
        8px 12px;

      border:
        1px solid
        var(--lime-border);

      border-radius: 999px;

      background:
        var(--lime-soft);

      color:
        var(--lime);

      font-size: 11px;

      font-weight: 900;

      text-transform:
        uppercase;

      letter-spacing:
        .12em;

      margin-bottom:
        22px;
    }

    .eyebrow-dot {
      width: 7px;
      height: 7px;

      border-radius: 50%;

      background:
        var(--lime);

      box-shadow:
        0 0 12px
        var(--lime);
    }

    h1 {
      max-width: 820px;

      font-size:
        clamp(
          44px,
          7vw,
          82px
        );

      line-height: .96;

      letter-spacing:
        -.07em;

      margin-bottom:
        25px;
    }

    h1 span {
      color:
        var(--lime);
    }

    .hero-copy {
      max-width: 700px;

      color:
        var(--muted);

      font-size: 18px;

      line-height: 1.75;

      margin-bottom:
        30px;
    }

    .hero-actions {
      display: flex;

      flex-wrap: wrap;

      gap: 12px;
    }

    .btn {
      min-height: 50px;

      padding:
        0 20px;

      border-radius:
        14px;

      display: inline-flex;

      align-items: center;

      justify-content: center;

      gap: 9px;

      border:
        1px solid
        var(--line);

      font-size: 13px;

      font-weight: 900;

      transition:
        transform .25s ease,
        background .25s ease,
        border-color .25s ease;
    }

    .btn:hover {
      transform:
        translateY(-2px);
    }

    .btn-primary {
      background:
        var(--lime);

      color:
        #080909;

      border-color:
        var(--lime);

      box-shadow:
        0 16px 35px
        rgba(183,255,0,.12);
    }

    .btn-secondary {
      background:
        rgba(255,255,255,.04);

      color:
        var(--text);
    }

    .btn-secondary:hover {
      background:
        rgba(255,255,255,.07);

      border-color:
        var(--line-strong);
    }

    /* =========================
       PRICE CARD
    ========================== */

    .price-card {
      position: relative;

      overflow: hidden;

      border:
        1px solid
        var(--purple-border);

      border-radius:
        32
