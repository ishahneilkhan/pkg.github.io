  <style>
    :root {
      --bg: #080909;
      --bg-soft: #0c0f0f;
      --card: #111414;
      --card-2: #151919;

      --text: #f7f8f8;
      --muted: #919999;

      --line: rgba(255,255,255,.08);
      --line-strong: rgba(255,255,255,.15);

      --lime: #b7ff00;
      --lime-soft: rgba(183,255,0,.10);

      --green: #35d07f;
      --danger: #ff6262;

      --shadow:
        0 30px 100px rgba(0,0,0,.42);

      --radius: 24px;

      --max: 1380px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      min-height: 100vh;

      background:
        radial-gradient(
          circle at 10% 0%,
          rgba(183,255,0,.09),
          transparent 28%
        ),
        radial-gradient(
          circle at 92% 8%,
          rgba(255,255,255,.05),
          transparent 23%
        ),
        linear-gradient(
          180deg,
          #080909 0%,
          #080909 55%,
          #0b0d0d 100%
        );

      color: var(--text);

      font-family:
        Inter,
        "Hind Siliguri",
        sans-serif;

      overflow-x: hidden;
    }

    body::before {
      content: "";

      position: fixed;
      inset: 0;

      pointer-events: none;

      z-index: -1;

      background-image:
        linear-gradient(
          rgba(255,255,255,.016) 1px,
          transparent 1px
        ),
        linear-gradient(
          90deg,
          rgba(255,255,255,.016) 1px,
          transparent 1px
        );

      background-size: 42px 42px;

      mask-image:
        linear-gradient(
          to bottom,
          black,
          transparent 78%
        );
    }

    ::selection {
      background: var(--lime);
      color: #080909;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    button {
      font: inherit;
    }

    img {
      max-width: 100%;
      display: block;
    }

    .container {
      width:
        min(
          var(--max),
          calc(100% - 40px)
        );

      margin-inline: auto;
    }

    /* ==================================================
       TOP BAR
    ================================================== */

    .topbar {
      min-height: 42px;

      display: flex;
      align-items: center;

      border-bottom:
        1px solid var(--line);

      background:
        rgba(8,9,9,.84);

      backdrop-filter:
        blur(18px);
    }

    .topbar-inner {
      width:
        min(
          var(--max),
          calc(100% - 40px)
        );

      margin-inline: auto;

      display: flex;
      align-items: center;
      justify-content: space-between;

      gap: 20px;
    }

    .top-message {
      color: var(--muted);

      font-size: 11px;
      font-weight: 600;

      white-space: nowrap;
    }

    .top-message strong {
      color: var(--lime);
    }

    .online-status {
      display: inline-flex;
      align-items: center;
      gap: 7px;

      color: #aeb6b6;

      font-size: 10px;
      font-weight: 700;
    }

    .online-dot {
      width: 7px;
      height: 7px;

      border-radius: 50%;

      background: var(--green);

      box-shadow:
        0 0 12px rgba(53,208,127,.65);
    }

    .online-dot.offline {
      background: var(--danger);

      box-shadow:
        0 0 12px rgba(255,98,98,.55);
    }

    /* ==================================================
       NAVBAR
    ================================================== */

    .navbar {
      position: sticky;
      top: 0;

      z-index: 1000;

      border-bottom:
        1px solid var(--line);

      background:
        rgba(8,9,9,.78);

      backdrop-filter:
        blur(25px);
    }

    .nav-inner {
      min-height: 76px;

      display: flex;
      align-items: center;
      justify-content: space-between;

      gap: 25px;
    }
